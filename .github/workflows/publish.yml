name: Publish

# Publishes to npm via Trusted Publishing (OIDC) when a v* tag is pushed.
# No long-lived token is stored anywhere — GitHub Actions authenticates to npm
# over OIDC, and npm verifies this repo + workflow. Provenance is automatic.
#
# One-time setup on npmjs.com: package starloghq → Settings → Trusted Publisher
#   Organization/user: starloghq   Repository: index   Workflow: publish.yml

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.x # >= 22.14 required for trusted publishing
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Ensure npm >= 11.5.1 (trusted publishing)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Fail fast before the expensive build/test: every version field in
      # package.json and server.json must agree, and (on this tag push) equal
      # the tag. Supersedes the old package.json-only tag check — also guards
      # the MCP-registry manifest (server.json) that used to drift unnoticed.
      - name: Check version consistency (and tag match)
        run: npm run check:versions

      # Build BEFORE tests: the facts CLI e2e tests spawn the built dist/cli.js.
      # Running tests first made them fail with "Cannot find module dist/cli.js"
      # (this blocked the v0.2.0 publish). Mirrors the ci.yml ordering.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Release gate — pack + smoke-test the tarball
        run: |
          echo "TARBALL=$(npm pack | tail -1)" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Smoke-test the packed tarball
        run: STARLOG_TARBALL="$GITHUB_WORKSPACE/$TARBALL" STARLOG_EXPECT_VERSION="$PKG_VERSION" bash scripts/smoke-test.sh

      - name: Publish to npm (OIDC, with provenance)
        # Blank the dummy token that actions/setup-node writes into .npmrc
        # (//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}); a non-empty
        # invalid token makes npm attempt token auth and skip OIDC. Empty →
        # npm uses OIDC trusted publishing.
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ""
